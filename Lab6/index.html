<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Studenți</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .container { display: flex; gap: 30px; }
        .form-box { flex: 1; background: #f4f4f4; padding: 20px; border-radius: 8px; }
        .list-box { flex: 2; }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; width: 100%; }
        button:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <h1>Catalog Studenți</h1>

    <div class="container">
        <div class="form-box">
            <h3>Adaugă Student</h3>
            <form id="studentForm">
                <label>Nume Student:</label>
                <input type="text" id="nume" required placeholder="Ex: Popescu Ion">
                
                <label>Anul de studiu (1-4):</label>
                <input type="number" id="an" min="1" max="4" required>
                
                <label>Media Generală:</label>
                <input type="number" id="media" step="0.01" min="1" max="10" required placeholder="Ex: 9.50">
                
                <button type="submit">Salvează Student</button>
            </form>
        </div>

        <div class="list-box">
            <h3>Lista Studenți</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nume</th>
                        <th>An</th>
                        <th>Media</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        async function incarcaStudenti() {
            try {
                const response = await fetch('api.php');
                const studenti = await response.json();
                
                const tbody = document.getElementById('tabelBody');
                tbody.innerHTML = '';

                studenti.forEach(s => {
                    const row = `<tr>
                        <td>${s.id}</td>
                        <td>${s.nume}</td>
                        <td>${s.an}</td>
                        <td><strong>${s.media}</strong></td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error('Eroare la încărcare:', error);
            }
        }

        document.getElementById('studentForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const data = {
                nume: document.getElementById('nume').value,
                an: document.getElementById('an').value,
                media: document.getElementById('media').value
            };

            try {
                const response = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('studentForm').reset();
                    incarcaStudenti(); 
                } else {
                    alert('Eroare: ' + result.message);
                }

            } catch (error) {
                console.error('Eroare la trimitere:', error);
            }
        });

        incarcaStudenti();
    </script>

</body>
</html>
