version: '3.8'

services:
  web:
    build: . 
    container_name: proiect-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mariadb-container

  mariadb-container:
    image: mariadb:10.5
    container_name: mariadb-container
    ports: 
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: Biblioteca
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: